name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Pilote d'impression libre Gutenprint (GPL v2+), compilé pour Android arm64.
      # En cas d'échec, l'APK est quand même produit, sans le pilote intégré.
      - name: Gutenprint (arm64)
        continue-on-error: true
        run: |
          set -ex
          GP=5.3.5
          curl -fsSL -o gp.tar.xz "https://sourceforge.net/projects/gimp-print/files/gutenprint-5.3/$GP/gutenprint-$GP.tar.xz/download"
          mkdir gpsrc && tar xf gp.tar.xz -C gpsrc --strip-components=1
          TC=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          cd gpsrc
          ./configure --host=aarch64-linux-android --prefix=/gp \
            CC=$TC/aarch64-linux-android29-clang AR=$TC/llvm-ar RANLIB=$TC/llvm-ranlib STRIP=$TC/llvm-strip \
            CFLAGS="-O2 -fPIC" \
            --disable-shared --enable-static --with-modules=no \
            --without-cups --without-gimp2 --disable-libgutenprintui2 --disable-nls \
            --disable-samples --disable-escputil --disable-test --disable-testpattern --without-doc
          make -C include
          make -C src/main -j4
          make -C src/xml -j4
          make -C src/xml install DESTDIR=$PWD/stage
          make -C include install DESTDIR=$PWD/stage
          OUT=$GITHUB_WORKSPACE/app/src/main/cpp/gp
          mkdir -p $OUT/lib $OUT/include $GITHUB_WORKSPACE/app/src/main/assets
          cp src/main/.libs/libgutenprint.a $OUT/lib/
          cp -r stage/gp/include/gutenprint $OUT/include/
          (cd stage/gp/share/gutenprint && zip -qr $GITHUB_WORKSPACE/app/src/main/assets/gutenprint-data.zip .)
          ls -la $OUT/lib $GITHUB_WORKSPACE/app/src/main/assets

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: canon3501-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 1
